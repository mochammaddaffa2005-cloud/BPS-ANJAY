<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Farewell Card</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--accent:#d69b63;
--text:#2d2d2d;
}

body{
font-family:Inter,sans-serif;
background:url("bg2.jpeg") center/cover fixed;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
animation:bgMove 18s ease-in-out infinite;
}

@keyframes bgMove{
0%,100%{background-position:0% 50%;}
50%{background-position:100% 50%;}
}

/* Opening */

#opening{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
backdrop-filter:blur(8px);
display:flex;
justify-content:center;
align-items:center;
font-family:"Playfair Display",serif;
font-size:30px;
text-align:center;
padding:30px;
color:white;
z-index:999;
animation:openingFade 2.4s forwards;
}

@keyframes openingFade{
0%,70%{opacity:1;}
100%{opacity:0;visibility:hidden;}
}

/* Scene */

.scene{
width:min(92vw,390px);
perspective:1400px;
opacity:0;
animation:showCard .8s forwards;
animation-delay:1.4s;
transition:max-width .5s ease;
}

@keyframes showCard{
to{opacity:1;}
}

/* Card */

.card{
position:relative;
width:100%;
aspect-ratio:1.586;
transform-style:preserve-3d;
transition:transform .8s cubic-bezier(.22,.61,.36,1);
cursor:pointer;
}

.card.flip{
transform:scale(1.03) rotateY(180deg);
}

.face{
position:absolute;
inset:0;
border-radius:22px;
overflow:hidden;
backface-visibility:hidden;
box-shadow:0 18px 40px rgba(0,0,0,.25);
}

/* FRONT */

.front img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.tap{
position:absolute;
bottom:12px;
left:50%;
transform:translateX(-50%);
background:rgba(255,255,255,.88);
padding:7px 14px;
border-radius:999px;
font-size:11px;
letter-spacing:1px;
transition:.3s;
}

.card:hover .tap{
transform:translateX(-50%) translateY(-2px);
}

/* BACK */

.back{
transform:rotateY(180deg);

background:
linear-gradient(rgba(247,241,233,.95),rgba(247,241,233,.95)),
url("bg2.jpeg") center/cover;

backdrop-filter:blur(14px);

padding:22px;

display:flex;
flex-direction:column;

color:var(--text);

height:min(78vh,620px);

overflow-y:auto;

border-radius:22px;
}

/* Scroll */

.back::-webkit-scrollbar{
width:6px;
}

.back::-webkit-scrollbar-thumb{
background:#c8b8a0;
border-radius:999px;
}

.label{
font-size:11px;
letter-spacing:3px;
text-transform:uppercase;
color:#777;
}

h1{
font-family:"Playfair Display",serif;
font-size:30px;
color:var(--accent);
margin-top:8px;
}

.sub{
font-size:13px;
color:#666;
margin-bottom:18px;
}

.msg{
font-size:14px;
line-height:1.8;
white-space:pre-line;
margin-bottom:18px;
}

.gallery{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:20px;
}

.gallery img{
width:100%;
aspect-ratio:1;
object-fit:cover;
border-radius:12px;
box-shadow:0 6px 15px rgba(0,0,0,.15);
transition:.3s;
}

.gallery img:hover{
transform:scale(1.03);
}

.song{
margin-top:auto;
padding-top:8px;
}

.song small{
display:block;
margin-bottom:8px;
color:#666;
}

#songTitle{
font-weight:500;
margin-bottom:10px;
}

iframe{
width:100%;
height:84px;
border:none;
border-radius:12px;
}

.footer{
margin-top:16px;
text-align:right;
font-style:italic;
color:#777;
}

/* Mobile */

@media(max-width:480px){

.scene{
width:92vw;
}

.back{
height:72vh;
padding:18px;
}

h1{
font-size:28px;
}

#opening{
font-size:26px;
}

}

</style>
</head>
<body>

<div class="scene" id="scene">

<div class="card" id="card">

<div class="face front">

<img id="frontImage" src="cards/rifqa.jpg" alt="Farewell Card">

<div class="tap">Tap to open</div>

</div>

<div class="face back">

<div>

<div class="label">READ PRIVATELY</div>

<div class="song">

<div id="songTitle"></div>

<iframe
id="song"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

<div class="footer">— Daffa</div>

</div>

</div>
